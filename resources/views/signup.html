<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="signup.css">
    
</head>
<body>

<div class="login-box">
    <h2>Create Account</h2>

    <form>
        <div class="input-box">
            <input type="text" required>
            <label>Username</label>
        </div>

        <div class="input-box">
            <input type="email" required>
            <label>Email</label>
        </div>

        <div class="input-box">
            <input type="password" required>
            <label>Password</label>
        </div>

        <button type="button" onclick="window.location.href='login.html'" class="btn">Sign Up</button> 

        <div class="links">
            <a href="login.html">🔑 Login</a>
            <a href="index.html">🏠 Home</a>
        </div>
    </form>
</div>

</body>
</html>
